<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Showcase"><meta name="theme-color" content="#1C232C"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Arbeitsplatz-App – dunkle Seitenleiste wie ein Rack-Case, helle Arbeitsfläche, Signalgelb wie Case-Beschriftung */
:root{
  --bg:#EFF1F4; --surface:#FFFFFF; --surface2:#F5F6F8; --line:#D6DAE0; --line2:#E6E9ED;
  --fg:#1A2028; --muted:#5B6673; --faint:#8C96A2;
  --rail:#1C232C; --rail-fg:#C9D1DA; --rail-muted:#7F8B98; --rail-hi:#2A333F; --rail-strong:#FFFFFF; --rail-logo:invert(1); --rail-line:transparent;
  --accent:#F0BE2C; --accent-ink:#221A02; --accent-text:#8A6400; --accent-soft:#FBF1CF;
  --ok:#1E7A4C; --ok-soft:#DFF2E7; --warn:#A85A06; --warn-soft:#FCEBD5; --bad:#B42318; --bad-soft:#FBE1DE; --info:#2560A6; --info-soft:#DEE9F7;
  --shadow:0 1px 2px rgba(20,28,38,.06),0 4px 16px rgba(20,28,38,.06);
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --logo-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151A; --surface:#191F26; --surface2:#1F262F; --line:#2D3641; --line2:#252D37;
  --fg:#E5E9EE; --muted:#9AA5B1; --faint:#6E7A87;
  --rail:#0C0F13; --rail-fg:#C9D1DA; --rail-muted:#6F7B88; --rail-hi:#1E252E;
  --accent:#F0BE2C; --accent-ink:#221A02; --accent-text:#F0C447; --accent-soft:#3A2F0E;
  --ok:#53C08A; --ok-soft:#173326; --warn:#F0A04B; --warn-soft:#3A2812; --bad:#F2766B; --bad-soft:#3D1B18; --info:#79AEEB; --info-soft:#172A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --logo-filter:invert(1); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151A; --surface:#191F26; --surface2:#1F262F; --line:#2D3641; --line2:#252D37;
  --fg:#E5E9EE; --muted:#9AA5B1; --faint:#6E7A87;
  --rail:#0C0F13; --rail-fg:#C9D1DA; --rail-muted:#6F7B88; --rail-hi:#1E252E;
  --accent:#F0BE2C; --accent-ink:#221A02; --accent-text:#F0C447; --accent-soft:#3A2F0E;
  --ok:#53C08A; --ok-soft:#173326; --warn:#F0A04B; --warn-soft:#3A2812; --bad:#F2766B; --bad-soft:#3D1B18; --info:#79AEEB; --info-soft:#172A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --logo-filter:invert(1); color-scheme:dark}
/* Helle Seitenleiste (Einstellung „Darstellung“) */
:root[data-rail="hell"]:not([data-theme="dark"]){--rail:#FFFFFF;--rail-fg:#3A4451;--rail-muted:#7C8794;--rail-hi:#EEF1F4;--rail-strong:#1A2028;--rail-logo:none;--rail-line:#DDE1E6}
@media (prefers-color-scheme: dark){:root[data-rail="hell"]:not([data-theme="light"]){--rail:#0C0F13;--rail-fg:#C9D1DA;--rail-muted:#6F7B88;--rail-hi:#1E252E;--rail-strong:#FFFFFF;--rail-logo:invert(1);--rail-line:transparent}}
:root[data-rail="hell"]:not([data-theme="dark"]) .mobilebar button.on{color:var(--accent-text)}
html.gross{zoom:1.1}
.darst{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.darst button{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.darst button.on{border-color:var(--accent)}
.darst .mini{height:62px;border-radius:6px;display:grid;grid-template-columns:28% 1fr;overflow:hidden;border:1px solid var(--line)}
.darst .mini i{display:block}.darst b{font-size:14px}.darst span{font-size:12px;color:var(--muted)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1} h2{font-size:21px} h3{font-size:17px} h4{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
a{color:var(--accent-text)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.r{text-align:right}.c{text-align:center}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.b{font-weight:600}.nowrap{white-space:nowrap}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
#rail{background:var(--rail);color:var(--rail-fg);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;overflow-y:auto;padding-block:14px}
.brand{padding:4px 18px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;color:var(--rail-strong)}
.brand b span{color:var(--accent)}

.brand .logo{width:100%;max-width:196px;height:auto;filter:var(--rail-logo);display:block;margin-bottom:6px}
.brand b{font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.mtop{display:none}
.lockbrand{display:flex;flex-direction:column;align-items:center;gap:6px}
.lockbrand .logo{width:100%;max-width:300px;height:auto;filter:var(--logo-filter)}
.lockbrand b,.mtop b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.lockbrand b span,.mtop b span{color:var(--accent-text)}
.mtop b span{color:var(--accent)}
.brand small{color:var(--rail-muted);font-size:12px;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--rail-fg);font-weight:500;font-size:14.5px}
.nav button:hover{background:var(--rail-hi)}
.nav button.on{background:var(--rail-hi);color:var(--rail-strong);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .sep{height:1px;background:var(--rail-hi);margin:8px 10px}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}
.railfoot{margin-top:auto;padding:12px 18px 0;font-size:12px;color:var(--rail-muted);display:flex;flex-direction:column;gap:6px}
.railfoot button{all:unset;cursor:pointer;color:var(--rail-fg);text-decoration:underline;text-underline-offset:2px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rail-muted);display:inline-block}
.sync.ok i{background:#53C08A}.sync.err i{background:#F2766B}.sync.busy i{background:var(--accent)}
#main{overflow-y:auto;min-width:0;position:relative}
.page{padding-inline:28px;padding-block:22px 80px;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead .sub{color:var(--muted);font-size:14px;margin-top:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card>.bd{padding:14px 16px}
.card>.bd.np{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:default}
.kpi[data-act]{cursor:pointer}.kpi[data-act]:hover{border-color:var(--line)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.warn{border-left:3px solid var(--warn)}.kpi.bad{border-left:3px solid var(--bad)}.kpi.ok{border-left:3px solid var(--ok)}
.tw{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--surface2)}
.t tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.t td.r,.t th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);white-space:nowrap;line-height:19px;border:1px solid var(--line2)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:8px 13px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs .cnt{font-size:11px;background:var(--surface2);border-radius:8px;padding:0 6px;margin-left:5px;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0;width:100%;font-size:14.5px}
textarea.inp{min-height:70px;resize:vertical;line-height:1.4}
select.inp{padding-right:4px}
.inp.sm{padding:4px 7px;font-size:13.5px}
.inp.num{text-align:right}
.inp[readonly]{background:var(--surface2)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld>.hint{font-size:12px;color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}
.form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 14px}
.form .w2{grid-column:span 2}.form .w3{grid-column:span 3}.form .w4{grid-column:span 4}.form .w5{grid-column:span 5}.form .w6{grid-column:span 6}.form .w8{grid-column:span 8}.form .w9{grid-column:span 9}.form .w12{grid-column:span 12}
.form h4{grid-column:span 12;margin-top:6px;padding-top:10px;border-top:1px solid var(--line2)}
.form h4:first-child{border-top:0;padding-top:0;margin-top:0}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.search{max-width:280px}
.empty{padding:34px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:19px;font-weight:600}
.note{background:var(--surface2);border:1px solid var(--line2);border-radius:7px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.info{background:var(--info-soft);border-color:transparent;color:var(--info)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line2);min-width:0}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface2)}
.li .grow{flex:1;min-width:0}
.li .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--line)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.ok{background:var(--ok)}.sev.info{background:var(--info)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
.mbox{background:var(--surface);border-radius:12px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-width:100%}
.mbox.wide{width:min(1060px,100%)}.mbox.xwide{width:min(1280px,100%)}.mbox.narrow{width:min(440px,100%)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line2);gap:10px}
.mbd{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.mft .l{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);max-width:360px}
.toast.bad{background:var(--bad);color:#fff}
/* beleg editor */
.postab{min-width:1000px}.postab td{padding:5px 5px;vertical-align:middle}.postab td:nth-child(3){min-width:200px}.postab select[data-b$=".kat"]{min-width:88px}.postab select[data-b$=".steuer"]{min-width:74px}
.mattab td:first-child{min-width:190px}
.split{grid-template-columns:minmax(0,1fr) minmax(0,340px);align-items:start}.split2{grid-template-columns:minmax(0,1fr) minmax(0,260px)}
@media (max-width:1000px){.split,.split2{grid-template-columns:minmax(0,1fr)}}
.postab .inp{padding:5px 6px}
.postab tr.opt td{background:var(--surface2)}
.postab tr.textrow td{background:var(--surface2)}
.postab .drag{cursor:grab;color:var(--faint)}
.sumbox{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-size:14.5px}
.sumbox .tot{font-weight:700;font-size:17px;border-top:2px solid var(--fg);padding-top:4px}
.lock{display:flex;gap:10px;align-items:center}
.a4pages{display:flex;flex-direction:column;align-items:center;gap:14px}
.a4lbl{align-self:stretch;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;left:0}
.a4wrap{width:100%;max-width:794px;display:flex;flex-direction:column;gap:4px}
.a4nr{font-size:11.5px;color:var(--faint);text-align:right}
.a4zoombtn{display:none}
.a4wrap svg{display:block;width:100%;height:auto;background:#fff;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 22px rgba(0,0,0,.14)}
.a4wrap svg text{font-family:Helvetica,Arial,"Liberation Sans",sans-serif;white-space:pre}
.umbruch{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--accent-text);text-transform:uppercase;letter-spacing:.06em}
.umbruch::before,.umbruch::after{content:"";flex:1;border-top:2px dashed var(--accent)}
.postab tr.umbruchrow td{background:var(--accent-soft)}
.postab tr.zwsrow td{background:var(--surface2);border-top:2px solid var(--line)}
.paperwrap{background:var(--surface2);padding:16px;border-radius:8px;overflow-x:auto}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line2);border-top:1px solid var(--line2)}
.cal .dh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface2)}
.cal .d{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.cal .d.out{background:var(--surface2);color:var(--faint)}
.cal .d.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 6px}
.cal .d.hol .dn::after{content:" •";color:var(--bad)}
.cal .dn{font-size:12.5px;font-weight:600;align-self:flex-start}
.ev{font-size:12px;line-height:1.25;padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-left:3px solid;background:var(--surface2)}
.ev.st-anfrage{border-color:var(--faint)}.ev.st-option{border-color:var(--warn);background:var(--warn-soft)}
.ev.st-bestaetigt{border-color:var(--info);background:var(--info-soft)}.ev.st-abgeschlossen{border-color:var(--ok);background:var(--ok-soft)}
.ev.st-abgesagt{border-color:var(--bad);text-decoration:line-through;opacity:.6}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;min-width:860px}
.week .col{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:240px}
.week .col.today{border-color:var(--accent)}
.week .ph{font-size:12.5px;border-left:3px solid var(--line);padding:3px 7px;background:var(--surface2);border-radius:4px;cursor:pointer}
.gantt{border-collapse:collapse;font-size:12.5px;min-width:100%}

const IDB = {
  db: null, mem: {},

        const r = indexedDB.open('auftragsbuch', 1);

  get(k) {

  set(k, v) {

  const items = coll === 'belege' ? all('belege').filter(b => nrArt(b.typ) === art) : all(coll);
  items.forEach(x => { if (x.nr && x.nr.startsWith(prefix)) { const n = parseInt(x.nr.slice(prefix.length), 10); if (n > max) max = n; } });

}

/* ============ Kalenderdatei (iCal) ============ */
function icsFor(auftraege) {
  const e = s => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const dt = s => s.replace(/[-:]/g, '').slice(0, 13) + '00';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Showcase//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:' + e(cfg().name)];
  auftraege.forEach(a => {
    const k = get('kunden', a.kundeId); const ort = [a.ort?.name, a.ort?.adresse].filter(Boolean).join(', ');
    const ph = (a.phasen || []).filter(p => p.von);
    const evs = ph.length ? ph.map(p => ({ id: a.id + p.id, von: p.von, bis: p.bis || p.von, t: `${a.titel} – ${p.typ}` })) : (a.von ? [{ id: a.id, von: a.von + 'T08:00', bis: (a.bis || a.von) + 'T20:00', t: a.titel }] : []);
    evs.forEach(ev => lines.push('BEGIN:VEVENT', `UID:${ev.id}@auftragsbuch`, `DTSTAMP:${dt(isoDT())}`, `DTSTART:${dt(ev.von)}`, `DTEND:${dt(ev.bis > ev.von ? ev.bis : ev.von.slice(0, 11) + '23:59')}`, `SUMMARY:${e(ev.t)}`, `LOCATION:${e(ort)}`, `DESCRIPTION:${e(`Kunde: ${kName(k)}\nStatus: ${AST[a.status]?.[0] || ''}\n${a.notiz || ''}`)}`, `STATUS:${a.status === 'bestaetigt' || a.status === 'abgeschlossen' ? 'CONFIRMED' : a.status === 'abgesagt' ? 'CANCELLED' : 'TENTATIVE'}`, 'END:VEVENT'));
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function formFields(schema, o, root = 'm') {
  return schema.map(f => {

    if (f.if && !f.if(o)) return '';
    if (f.html) return `<div class="${f.w || 'w12'}">${f.html(o)}</div>`;
    const b = `${root}.${f.k}`; const v = getPath(o, f.k); let el;
    const a = { ...(f.a || {}) }; if (f.rr) a['data-rr'] = '';
    switch (f.t) {
      case 'num': el = inp(b, v, { t: 'num', ...a }); break;
      case 'int': el = inp(b, v, { t: 'int', ...a }); break;
      case 'date': el = inpD(b, v, a); break;
      case 'dt': el = inpDT(b, v, a); break;
      case 'time': el = inpT(b, v, a); break;
      case 'area': el = txt(b, v, a); break;

  }).join('');
}

/* ============ Miettage: im Mietzeitraum nur einzelne Tage berechnen ============

const pauseIn = (pause, d1, d2) => (pause || []).filter(d => d1 && d >= d1 && d <= (d2 || d1));

function tageKurz(liste) {

  s.forEach(d => { const g = gr[gr.length - 1]; if (g && addDays(g[1], 1) === d) g[1] = d; else gr.push([d, d]); });
  const f = ([a, b]) => a === b ? fmtD(a).slice(0, 6) : a.slice(0, 7) === b.slice(0, 7) ? `${fmtD(a).slice(0, 3)}–${fmtD(b).slice(0, 6)}` : `${fmtD(a).slice(0, 6)}–${fmtD(b).slice(0, 6)}`;

    p.tage = p.tageWahl ? p.tageWahl.length : belegMietTage(b);

}

/* ============ Dateien zu Artikeln (Bedienungsanleitungen als PDF) ============
   Speicherort: Claude-Version → Datei-Ablage der App · eigenständige Version → auf dem Gerät (IndexedDB)
   und zusätzlich als eigene Datei in OneDrive (Apps/Showcase/Anleitungen), damit die große PDF nicht
   bei jedem Abgleich mitgeschickt wird. Andere Geräte laden sie erst beim Öffnen herunter. */
const DATEI_MAX = 60 * 1024 * 1024;
const dateiKey = id => `datei/${id}`;
const dateiSet = async (k, v) => { await IDB.set(k, v); if (IDB.db) delete IDB.mem[k]; };
const odDateiPfad = rec => `/me/drive/special/approot:/${rec.zweck === 'bild' ? 'Bilder' : 'Anleitungen'}/${encodeURIComponent(rec.odName)}`;
const anleitungen = artikelId => all('anhaenge').filter(x => x.zweck === 'anleitung' && x.artikelId === artikelId).sort(by(x => x.name.toLowerCase()));
const groesse = b => !b ? '' : b > 1048576 ? numS(r2(b / 1048576)) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

async function dateiSpeichern(file, meta) {
  const istBild = meta && meta.zweck === 'bild';
  if (!istBild && !/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('Bitte eine PDF-Datei wählen.', 'bad'); return null; }
  if (file.size > DATEI_MAX) { toast(`Die Datei ist zu groß (${groesse(file.size)}, max. 60 MB).`, 'bad'); return null; }
  const rec = { id: uid('an'), name: file.name, typ: istBild ? (file.type || 'image/jpeg') : 'application/pdf', size: file.size, datum: today(), ...meta };
  if (S.caps.assets) {
    try { const r = await S.caps.assets.upload(file); Object.assign(rec, { assetId: r.id, url: r.url }); return DB.put('anhaenge', rec); }
    catch (e) { console.warn('asset', e); toast('Hochladen fehlgeschlagen – bitte erneut versuchen.', 'bad'); return null; }
  }
  const buf = await file.arrayBuffer(); await dateiSet(dateiKey(rec.id), buf);
  rec.odName = `${rec.id}-${fileSafe(file.name.replace(/\.(pdf|jpe?g|png|webp|heic)$/i, ''))}.${istBild ? 'jpg' : 'pdf'}`; rec.od = 'offen';
  const saved = DB.put('anhaenge', rec);
  dateiWarteschlange();
  return saved;
}
async function dateiHochladen(rec) {
  const buf = await IDB.get(dateiKey(rec.id)); if (!buf) return false;
  const len = buf.byteLength;
  if (len <= 4 * 1024 * 1024) {
    const r = await Sync.api('PUT', odDateiPfad(rec) + ':/content', buf, { 'Content-Type': rec.typ || 'application/pdf' }); if (!r.ok) throw new Error('Upload ' + r.status);
  } else {
    const s = await Sync.api('POST', odDateiPfad(rec) + ':/createUploadSession', JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }), { 'Content-Type': 'application/json' });
    if (!s.ok) throw new Error('Upload ' + s.status); const { uploadUrl } = await s.json(); const CH = 327680 * 12;
    for (let o = 0; o < len; o += CH) { const e = Math.min(len, o + CH); const r = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${o}-${e - 1}/${len}` }, body: buf.slice(o, e) }); if (!r.ok) throw new Error('Upload ' + r.status); }
  }
  const akt = get('anhaenge', rec.id); if (akt) DB.put('anhaenge', { ...akt, od: 'ok' });
  return true;
}
let dateiLaeuft = false;
async function dateiWarteschlange() {
  if (dateiLaeuft || typeof Sync === 'undefined' || !Sync.aktiv()) return; dateiLaeuft = true;
  try { for (const rec of all('anhaenge').filter(x => x.od === 'offen')) { try { await dateiHochladen(rec); } catch (e) { console.warn('datei', e); break; } } }
  finally { dateiLaeuft = false; }
}
setInterval(() => { if (S.loaded) dateiWarteschlange(); }, 30000);

async function dateiLaden(rec) {
  if (rec.data) return dataUrlToBlob(rec.data);
  if (rec.assetId || rec.url) { const r = await fetch(anhangUrl(rec)); if (r.ok) return await r.blob(); return null; }
  let buf = await IDB.get(dateiKey(rec.id)); if (buf) return new Blob([buf], { type: rec.typ || 'application/pdf' });
  if (rec.odName && typeof Sync !== 'undefined' && Sync.aktiv()) {
    const r = await Sync.api('GET', odDateiPfad(rec) + ':/content'); if (!r.ok) return null;
    buf = await r.arrayBuffer(); dateiSet(dateiKey(rec.id), buf); return new Blob([buf], { type: rec.typ || 'application/pdf' });
  }
  return null;
}
async function dateiLoeschen(rec) {
  DB.del('anhaenge', rec.id); IDB.del(dateiKey(rec.id));
  if (rec.odName && rec.od === 'ok' && typeof Sync !== 'undefined' && Sync.aktiv()) { try { await Sync.api('DELETE', odDateiPfad(rec)); } catch (e) { } }
}

/* ============ Produktbilder ============
   Je Artikel bis zu 5 Bilder. Gespeichert wie die Anleitungen (Gerät + OneDrive „Apps/Showcase/Bilder“),
   im Datensatz liegt nur ein Mini-Vorschaubild. Für die Anfrageseite wird eine Webversion (max. ~45 KB)
   über das Google-Script übertragen. Das erste Bild ist das Hauptbild. */
const BILD_MAX = 5;
const artBilder = id => all('anhaenge').filter(x => x.zweck === 'bild' && x.artikelId === id).sort(by(x => String(nz(x.pos) + 1000).padStart(5, '0') + (x._c || '')));

const artMini = (id, cls = 'artmini') => { const b = hauptBild(id); return b && b.mini ? `<img class="${cls}" src="${b.mini}" alt="" loading="lazy">` : ''; };

/* ---------- Bildbearbeitung im Browser ---------- */
async function bildLaden(blob) {
  if (typeof createImageBitmap === 'function') { try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(blob); const i = new Image(); i.onload = () => { res(i); setTimeout(() => URL.revokeObjectURL(u), 1000); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Das Bildformat wird von diesem Browser nicht unterstützt (bitte JPG oder PNG).')); }; i.src = u; });
}
function bildCanvas(img, max) {

// Unterschrift aufbereiten: helle Pixel weiß, auf Tinte zuschneiden, als JPEG
function sigAufbereiten(src) {
  const w = src.width, h = src.height; const x = src.getContext('2d'); const d = x.getImageData(0, 0, w, h); const px = d.data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let i = 0; i < w * h; i++) { const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2]; const l = .3 * r + .59 * g + .11 * b; if (l > 175) { px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = 255; } else { const xx = i % w, yy = (i / w) | 0; if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; } }
  if (x1 < 0) return null;
  x.putImageData(d, 0, 0); const pad = Math.round(Math.max(x1 - x0, y1 - y0) * .04) + 4; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1; const s = Math.min(1, 900 / cw, 360 / ch); const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(cw * s)); o.height = Math.max(1, Math.round(ch * s));
  const ox = o.getContext('2d'); ox.fillStyle = '#fff'; ox.fillRect(0, 0, o.width, o.height); ox.drawImage(src, x0, y0, cw, ch, 0, 0, o.width, o.height); return o.toDataURL('image/jpeg', .9);
}
